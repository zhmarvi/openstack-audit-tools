[defaults]
# Default inventory. Copy inventory/hosts.example.ini to inventory/hosts.ini
# and edit it, or override with `-i` on the command line.
inventory = inventory/hosts.ini

# These audit playbooks are read-only evidence collectors. Keep output quiet
# and predictable.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
