# Sample inventory for the OpenStack audit playbooks.
#
# Copy this file to inventory/hosts.ini and adjust to your deployment:
#   cp inventory/hosts.example.ini inventory/hosts.ini
#
# The audit_instances.yml playbook targets the `nova_compute` group by default
# (override with -e nova_compute_group=<group>). List your compute nodes here.

[nova_compute]
# compute-01 ansible_host=10.0.0.11
# compute-02 ansible_host=10.0.0.12

[nova_compute:vars]
# Connection settings for the compute nodes. The playbook uses `become: true`
# on the managed hosts to read /var/lib/nova/instances and query libvirt.
# ansible_user = stack
# ansible_ssh_private_key_file = ~/.ssh/id_rsa
